# 修改此文件后，需要重新启动 Jekyll 预览服务。

# 站点与作者
title: "PenguinLee's Blog"
url: https://pen9u1nlee.github.io
baseurl: ""
description: PenguinLee玩抽象的地方
lang: zh-Hans
timezone: Asia/Shanghai

author:
  type: person
  name: PenguinLee
  avatar:
  bio: 凡人一个

# 外观与文章
text_skin: default
highlight_theme: default
excerpt_separator: <!--more-->
license: CC-BY-NC-4.0
toc:
  selectors: h1,h2,h3

mathjax: true
mathjax_autoNumber: true
mermaid: true
chart: true

paginate: 8
paginate_path: /page:num
sources: bootcdn

# 可选服务
sharing:
  provider: false
comments:
  provider: false
pageview:
  provider: false
search:
  provider: default
analytics:
  provider: false

# 构建
markdown: kramdown
highlighter: rouge
permalink: date

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - jekyll-text-theme.gemspec
  - package-lock.json
  - package.json
  - Dockerfile.dev
  - /docker
  - /node_modules
  - /vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      license: true
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: true
      pageview: true

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jemoji
